services:
  coffria-redis:
    image: redis:7-alpine
    container_name: coffria-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - coffria_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - coffria_internal

  coffria-ollama:
    image: ollama/ollama:0.11.4
    container_name: coffria-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - coffria_ollama_data:/root/.ollama
    expose:
      - "11434"
    mem_limit: 1800m
    cpus: 1.5
    networks:
      - coffria_internal

  coffria-api:
    image: ghcr.io/doumouss29/coffria-api:latest
    container_name: coffria-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://coffria-redis:6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://coffria-ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      API_PORT: 4000
    depends_on:
      coffria-redis:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - proxy
      - backend
      - coffria_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.coffria-api.rule=Host(`coffria.ci`) && PathPrefix(`/api`)"
      - "traefik.http.routers.coffria-api.entrypoints=websecure"
      - "traefik.http.routers.coffria-api.tls=true"
      - "traefik.http.routers.coffria-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.coffria-api.priority=100"
      - "traefik.http.services.coffria-api.loadbalancer.server.port=4000"

  coffria-web:
    image: ghcr.io/doumouss29/coffria-web:latest
    container_name: coffria-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - coffria-api
    expose:
      - "3000"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.coffria-web.rule=Host(`coffria.ci`)"
      - "traefik.http.routers.coffria-web.entrypoints=websecure"
      - "traefik.http.routers.coffria-web.tls=true"
      - "traefik.http.routers.coffria-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.coffria-web.priority=10"
      - "traefik.http.services.coffria-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.coffria-www.rule=Host(`www.coffria.ci`)"
      - "traefik.http.routers.coffria-www.entrypoints=websecure"
      - "traefik.http.routers.coffria-www.tls=true"
      - "traefik.http.routers.coffria-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.coffria-www.priority=200"
      - "traefik.http.routers.coffria-www.middlewares=coffria-www-redirect"
      - "traefik.http.routers.coffria-www.service=coffria-web"
      - "traefik.http.middlewares.coffria-www-redirect.redirectregex.regex=^https?://www\\.coffria\\.ci/(.*)"
      - "traefik.http.middlewares.coffria-www-redirect.redirectregex.replacement=https://coffria.ci/$${1}"
      - "traefik.http.middlewares.coffria-www-redirect.redirectregex.permanent=true"

volumes:
  coffria_redis_data:
  coffria_ollama_data:

networks:
  proxy:
    external: true
  backend:
    external: true
  coffria_internal:
    name: coffria_internal
    driver: bridge
