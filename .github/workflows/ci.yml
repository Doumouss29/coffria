name: Coffria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  api-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://build_user:build_password@localhost:5432/build_database?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: https://coffria.ci/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  docker-api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image with LibreOffice and LibreDWG
        run: docker build -t coffria-api-ci ./apps/api

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-build, web-build, docker-api-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/doumouss29/coffria-api:latest
            ghcr.io/doumouss29/coffria-api:${{ github.sha }}
          cache-from: type=gha,scope=coffria-api
          cache-to: type=gha,mode=max,scope=coffria-api

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://coffria.ci/api
          tags: |
            ghcr.io/doumouss29/coffria-web:latest
            ghcr.io/doumouss29/coffria-web:${{ github.sha }}
          cache-from: type=gha,scope=coffria-web
          cache-to: type=gha,mode=max,scope=coffria-web
