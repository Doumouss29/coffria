services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffria}
      POSTGRES_USER: ${POSTGRES_USER:-coffria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffria_local_change_me}
    volumes:
      - coffria_pg:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffria} -d ${POSTGRES_DB:-coffria}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  coffria_pg:
